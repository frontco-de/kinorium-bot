version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime dependencies ship to the Worker, so they are reviewed alone.
      production:
        dependency-type: production
      development:
        dependency-type: development
      # Security updates ignore the schedule and open as soon as an advisory is
      # published, so batch the development ones into a single PR. Runtime
      # security fixes stay ungrouped and are never delayed.
      development-security:
        applies-to: security-updates
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
