name: Compile and lint code

on:
  push:
    branches: [main]
  pull_request:
    types: [synchronize, opened, reopened]

# The workflow only reads the repository; deployments happen in Cloudflare.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-code:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a moving tag would let a compromised
      # release run in CI. Dependabot updates the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install modules
        run: yarn install --immutable
      - name: Validate Worker
        run: yarn validate
      - name: Audit dependencies
        run: yarn npm audit --environment production --all

  review-dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
