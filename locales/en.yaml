name: English
start: |
  🎬 <b>Find movies and TV series on Kinorium.</b>

  In any chat, type <code>@${username} Dune 2021</code>, then select a result.

  Use /language to change the language or /help for detailed instructions.
help: |
  <b>How to use the bot</b>

  1. Open any Telegram chat.
  2. Type <code>@${username}</code> followed by a movie or TV-series title. Add a year for a more precise search.
  3. Select a result to send it.

  Example: <code>@${username} Dune 2021</code>

  /language — change the language
  /help — show these instructions
language: Please, select the language.
language_selected: <b>This bot</b> now speaks English.
inline:
  movie: 'Movie'
  tv_series: 'TV series'
  no_results_title: 'No results'
  no_results_description: 'No results for “${query}”'
  no_results_message: 'No results for “${query}”. Try another title, fix spelling, or add a year (e.g., “Dune 2021”).'
  api_error_title: 'Service unavailable'
  api_error_description: "Can't reach Kinorium"
  api_error_message: 'Kinorium is temporarily unavailable. Please try again in a minute.'
