name: Українська
start: |
  🎬 <b>Знаходьте фільми й серіали на Kinorium.</b>

  У будь-якому чаті введіть <code>@${username} Dune 2021</code>, а потім виберіть результат.

  Скористайтеся /language, щоб змінити мову, або /help, щоб переглянути докладну інструкцію.
help: |
  <b>Як користуватися ботом</b>

  1. Відкрийте будь-який чат у Telegram.
  2. Введіть <code>@${username}</code> і назву фільму або серіалу. Додайте рік для точнішого пошуку.
  3. Виберіть результат, щоб надіслати його.

  Приклад: <code>@${username} Dune 2021</code>

  /language — змінити мову
  /help — показати цю інструкцію
language: Будь ласка, оберіть мову.
language_selected: <b>Цей бот</b> тепер говорить українською.
