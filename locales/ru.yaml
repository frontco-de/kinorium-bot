name: Русский
start: |
  🎬 <b>Находите фильмы и сериалы на Kinorium.</b>

  В любом чате введите <code>@${username} Dune 2026</code>, а затем выберите результат.

  Используйте /language, чтобы изменить язык, или /help, чтобы открыть подробную инструкцию.
help: |
  <b>Как пользоваться ботом</b>

  1. Откройте любой чат в Telegram.
  2. Введите <code>@${username}</code> и название фильма или сериала. Добавьте год для более точного поиска.
  3. Выберите результат, чтобы отправить его.

  Пример: <code>@${username} Dune 2026</code>

  /language — изменить язык
  /help — показать эту инструкцию
language: Пожалуйста, выберите язык.
language_selected: <b>Бот</b> теперь говорит по-русски.
language_menu_not_yours: Это меню языка принадлежит другому пользователю. Отправьте /language, чтобы открыть своё.
